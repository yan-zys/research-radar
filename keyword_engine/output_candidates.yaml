  level: A
  source: seed
  reason: 人工指定添加：神经肽注释
  status: approved
- keyword: neuropeptide-receptor pairing prediction
  level: A
  source: seed
  reason: 人工指定添加：神经肽-受体配对预测
  status: approved
- keyword: GPCR deorphanization
  level: A
  source: seed
  reason: 人工指定添加：GPCR 去孤儿化，神经肽-受体配对预测的标准方法
  status: approved
