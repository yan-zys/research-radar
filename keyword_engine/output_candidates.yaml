- keyword: Urbilateria
  level: A
  source: seed
  reason: 两侧对称动物最近共同祖先的概念，是其'脑共同起源vs独立起源'核心科学问题最直接的检索词，可兼容urbilaterian写法。
  status: approved
- keyword: Xenacoelomorpha
  level: A
  source: seed
  reason: 异无腔动物是基部两侧对称动物的关键演化支，其神经系统单细胞研究直接左右bilaterian脑起源争论，属必读。
  status: approved
- keyword: Panarthropoda
  level: A
  source: seed
  reason: 泛节肢动物涵盖画像中tardigrade、velvet worm及昆虫等主力物种，该演化支的比较脑研究与其中枢神经系统分段起源问题高度相关。
  status: approved
- keyword: ctenophore nervous system
  level: A
  source: seed
  reason: 栉水母神经元是否独立起源是'independent origin hypothesis'争论的关键证据来源，相关论文直接冲击其核心假说。
  status: approved
- keyword: nervous system centralization
  level: A
  source: seed
  reason: 神经系统集中化是否单次发生是脑起源争论的核心命题，是该领域标志性概念词。
  status: approved
- keyword: deep homology
  level: A
  source: seed
  reason: 深层同源性是评估远缘物种间细胞类型与神经结构同源关系的理论框架，与其同源比较方法学直接呼应。
  status: approved
- keyword: cell type phylogeny
  level: A
  source: seed
  reason: 将细胞类型视为可演化性状并构建系统发育树的新范式，与其ancestral cell type reconstruction研究直接对应。
  status: approved
- keyword: gene regulatory network evolution
  level: A
  source: seed
  reason: GRN演化是其转录因子调控网络比较方法的上游理论框架，关联细胞类型创新的分子机制，属核心概念。
  status: approved
- keyword: neuropeptide evolution
  level: A
  source: seed
  reason: 神经肽能细胞类型是跨物种神经元同源比较（如Arendt学派工作）的核心证据体系，与早期神经系统演化研究紧密绑定。
  status: approved
- keyword: spatial transcriptomics
  level: B
  source: seed
  reason: 可为单细胞图谱提供脑区解剖空间坐标，是跨物种比较细胞图谱的自然延伸技术。
  status: approved
- keyword: Stereo-seq
  level: B
  source: seed
  reason: 画像邮箱显示其任职于华大（genomics.cn），Stereo-seq为该机构核心空间组学平台，适用于非模式生物脑图谱构建。
  status: approved
- keyword: single-cell ATAC sequencing
  level: B
  source: seed
  reason: 单细胞染色质可及性测序可为其顺式调控元件与TF网络演化提供跨物种比较的新数据维度。
  status: approved
- keyword: SATURN
  level: B
  source: seed
  reason: 基于蛋白嵌入的跨物种细胞类型映射工具（Nature Methods 2024），可直接补充或对标其SAMap/MetaNeighbor流程。
  status: approved
- keyword: SCENIC
  level: B
  source: seed
  reason: 单细胞调控子（regulon）推断的标准工具，可系统性强化其转录因子调控网络比较分析。
  status: approved
- keyword: phylostratigraphy
  level: B
  source: seed
  reason: 基因系统发育年代学方法，可将新基因起源时间线与神经系统及细胞类型创新事件关联，服务其演化创新研究。
  status: approved
- keyword: transcriptomic hourglass
  level: C
  source: seed
  reason: 发育约束'沙漏模型'正被单细胞数据重新审视，是连接其演化与发育视角的新兴概念。
  status: approved
- keyword: developmental systems drift
  level: C
  source: seed
  reason: 发育系统漂移提示同源结构可由趋异机制构建，对其细胞类型同源性推断构成重要概念警示。
  status: approved
- keyword: comparative connectomics
  level: C
  source: seed
  reason: 跨物种突触连接组比较正兴起，可为转录组层面的细胞类型同源性提供互补证据链。
  status: approved
- keyword: single-cell multi-omics
  level: C
  source: seed
  reason: 多模态联合定义细胞类型是领域趋势，可能重塑跨物种细胞类型同源性的判定标准。
  status: approved
- keyword: evolutionary cell biology
  level: C
  source: seed
  reason: 演化细胞生物学作为新兴交叉领域正在成形，可为其研究提供概念框架与学术共同体动向。
  status: approved
