# 关键词库（唯一被 filter/scoring 读取的配置）
# 2026-07-31 更新：新增 core 组（脑/神经核心方向，最高权重，命中必推送——
# 用户要求"脑/神经演化、脑/神经发育、脑/神经TF调控命中一定要推送"，
# 其中 5 个演化类词条自 concept 组迁入）与 topics 组（31 个大方向主题词，
# 组权重 2 为用户拍板；Evolutionary genomics 与 concept 组重复，去重后收 30 条）。
# 2026-07-31 二次更新：6 个广义脑/神经词自 core 拆为 core_broad 组（同权重 15），
# 须与组学锚点共现才 A0 必推送——用户明确大方向为单细胞转录组/基因组/空间转录组。
# 二级权重规则（用户确认）：
#   - 组权重：core 15 / core_broad 15 / concept 10 / tools 9 / methods 8 / species 5 / topics 2
#   - 词条权重：全部为种子输入词，weight=2 且 locked=true，
#     无论负反馈如何不得降权（仅人工可删除词条）
