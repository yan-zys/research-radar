# 关键词库（唯一被 filter/scoring 读取的配置）
# 2026-08-04 重构：按用户五段式模板（research_interest / keywords / methods /
# species / exclude）重排全库——
#   - concept 组新增 transposable element（TE调控；先入 core 后发现植物 TE
#     论文被无条件强推，移至 concept——脑 TE 论文经 brain+组学锚点仍必推送）；
#   - core_broad 组删除 cerebellum、cerebral cortex（用户要求），新增 brain /
#     neuron / neural / glia 四个单词词条（须与组学锚点共现才 A0 必推送）；
#   - tools 组并入 methods（SAMap / TranscriptFormer / MetaNeighbor，用户模板
#     无 tools 段，权重随 methods=8）；single-cell transcriptomic atlas
#     construction 保留在 methods；
#   - cross-species cell type homology comparison / orthologous gene
#     identification / transcription factor regulatory network comparison
#     自 methods 移至 concept（用户指定放回 keywords 段）；
#   - species 组按用户模板扩充（有爪/节肢/扁形/环节/软体/脊索等门及代表物种）；
#   - topics 组新增 8 个泛 AI 词（artificial intelligence 等，weight 2 兜底）；
#   - negative 新增 carcinoma / disease biomarker / crop yield / plant breeding /
#     agriculture production / food science。
# 二级权重规则（用户确认）：
#   - 组权重：core 15 / core_broad 15 / concept 10 / methods 8 / species 5 / topics 2
#   - 词条权重：全部为种子输入词，weight=2 且 locked=true，
#     无论负反馈如何不得降权（仅人工可删除词条）
