name = "research-radar-feedback"
main = "worker.js"
compatibility_date = "2026-08-01"

# 填入你的 Cloudflare account_id（dash 右侧栏或 `wrangler whoami` 可见）
account_id = "YOUR_ACCOUNT_ID"

# 密钥不写在文件里，用命令设置（见 README.md）：
#   wrangler secret put GH_TOKEN   # fine-grained PAT, 仅需 contents:write
#   wrangler secret put APP_KEY    # 页面与 Worker 之间的共享口令
