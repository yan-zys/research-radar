<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Literature Intelligence Report · {{date}}</title>
<style>
  body { font-family: -apple-system, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
         background: #f2f4f8; color: #222; margin: 0; padding: 28px 16px 64px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .subtitle { color: #66788c; font-size: 13px; margin: 0 0 18px; line-height: 1.7; }
  .overview { background: #fff; border: 1px solid #e4e9ef; border-left: 4px solid #0b5cad;
              border-radius: 8px; padding: 12px 16px; font-size: 14px; line-height: 1.7;
              margin-bottom: 22px; }
  .card { background: #fff; border: 1px solid #e0e5ec; border-radius: 10px;
          padding: 16px 20px; margin: 16px 0; box-shadow: 0 1px 3px rgba(20,40,80,.05); }
  .card.c-must { border-left: 5px solid #c0392b; }
  .card.c-important { border-left: 5px solid #e67e22; }
  .card.c-relate { border-left: 5px solid #8a97a5; }
  .card-head { font-size: 12px; color: #8a97a5; margin-bottom: 8px; }
  .rank { font-weight: bold; color: #333; margin-right: 10px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 10px;
           color: #fff; font-weight: bold; vertical-align: middle; }
  .badge.b-must { background: #c0392b; }
  .badge.b-important { background: #e67e22; }
  .badge.b-relate { background: #8a97a5; }
  .score { color: #0b5cad; font-weight: bold; margin-left: 10px; }
  .title-en { font-size: 16px; font-weight: bold; line-height: 1.5; margin: 6px 0; }
  .title-en a { color: #112233; text-decoration: none; }
  .title-en a:hover { color: #0b5cad; text-decoration: underline; }
  .title-cn { font-size: 14px; color: #555; line-height: 1.6; margin: 2px 0 8px; }
  .one-line { font-size: 14px; color: #333; line-height: 1.7; margin: 6px 0; }
  .meta { color: #66788c; font-size: 12px; margin: 4px 0; line-height: 1.7; }
  .meta a { color: #0b5cad; text-decoration: none; }
  .keywords { color: #7a6f9b; }
  details.card-details { margin-top: 10px; border-top: 1px dashed #e0e5ec; padding-top: 10px; }
  details.card-details summary { cursor: pointer; font-size: 13px; color: #0b5cad;
                                 user-select: none; }
  .d-block { font-size: 14px; color: #333; line-height: 1.8; margin: 10px 0; }
  .d-block .lbl { color: #0b5cad; font-weight: bold; }
  .en-abstract { font-size: 13px; color: #666; line-height: 1.7; margin: 10px 0 4px;
                 padding: 8px 12px; border-left: 4px solid #ccd6e2;
                 background: #f7f9fc; border-radius: 0 6px 6px 0; }
  .fb-row { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #e0e5ec;
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .fb-btn { font-size: 12px; padding: 5px 14px; border: 1px solid #0b5cad;
            border-radius: 14px; color: #0b5cad; background: #fff; cursor: pointer; }
  .fb-btn:hover { background: #eef4fb; }
  .fb-btn.selected { background: #0b5cad; color: #fff; }
  .fb-status { font-size: 12px; margin-left: 4px; }
  .fb-status.ok { color: #1a7f37; }
  .fb-status.fail { color: #c0392b; }
  .fb-status.pending { color: #8a97a5; }
  .trend-title { font-size: 18px; color: #0b5cad; margin: 30px 0 4px; }
  .trend-layer { color: #9aa5b1; font-size: 12px; margin: 0 0 14px; line-height: 1.6; }
  .trend-overview { font-size: 14px; line-height: 1.7; background: #fff;
                    border: 1px solid #e4e9ef; border-left: 4px solid #0b5cad;
                    border-radius: 0 6px 6px 0; padding: 12px 16px; margin: 0 0 14px; }
  .trend-block { background: #fff; border: 1px solid #e4e9ef; border-radius: 8px;
                 padding: 12px 16px; margin: 12px 0; font-size: 14px; line-height: 1.7; }
  .trend-block-title { font-size: 14px; font-weight: bold; color: #0b5cad; margin: 0 0 8px; }
  .trend-dir { margin: 6px 0; }
  .trend-dir-no { display: inline-block; font-weight: bold; color: #0b5cad; margin-right: 8px; }
  .trend-text { margin: 0; }
  .footer { text-align: center; color: #9aa5b1; font-size: 12px; margin-top: 40px;
            line-height: 1.8; }
  .footer a { color: #0b5cad; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
<h1>Daily Literature Intelligence Report · {{date}}</h1>
<p class="subtitle">论文详情卡片 · 每卡可展开详情，卡底一键反馈（点击即记录，不跳转页面）· 文末为今日推荐文献价值总结</p>

<div class="overview">{{overview_line}}</div>

{{cards}}

<h2 class="trend-title">今日推荐文献价值总结</h2>
<p class="trend-layer">趋势分析层 · 基于今日 Must Read/Important 论文 AI 生成（无则取评分 Top 5）</p>
{{trend}}

<p class="footer">Research Radar · 按日期归档：<a href="../index.html">全部日报列表</a><br>
反馈数据保存在本机（127.0.0.1:8710），用于持续优化推荐与关键词权重</p>
</div>

<script>
document.querySelectorAll('.fb-btn').forEach(function (btn) {
  btn.addEventListener('click', async function () {
    var row = btn.closest('.fb-row');
    var status = row.querySelector('.fb-status');
    status.textContent = '提交中…';
    status.className = 'fb-status pending';
    try {
      var resp = await fetch(btn.dataset.url, { method: 'GET' });
      if (!resp.ok) { throw new Error('HTTP ' + resp.status); }
      row.querySelectorAll('.fb-btn').forEach(function (b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
      status.textContent = '已记录 ✓';
      status.className = 'fb-status ok';
    } catch (e) {
      status.textContent = '记录失败：请确认本机反馈服务已启动（feedback/server.py）';
      status.className = 'fb-status fail';
    }
  });
});
</script>
</body>
</html>
