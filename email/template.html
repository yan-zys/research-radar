<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Research Radar 日报 {{date}}</title>
<style>
  body { font-family: -apple-system, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
         max-width: 760px; margin: 0 auto; padding: 16px; color: #222; }
  h1 { font-size: 20px; border-bottom: 2px solid #333; padding-bottom: 8px; }
  h2 { font-size: 16px; color: #0b5cad; margin-top: 28px; }
  .summary { background: #f4f7fb; border-left: 4px solid #0b5cad; padding: 10px 14px; }
  .card { border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; margin: 12px 0; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .meta { color: #666; font-size: 12px; margin-bottom: 8px; }
  .abstract { font-size: 13px; color: #444; }
  .cn { font-size: 13px; margin: 6px 0; }
  .reason { font-size: 13px; color: #0b5cad; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 8px;
           background: #0b5cad; color: #fff; margin-left: 6px; }
  .feedback a { display: inline-block; margin-right: 8px; font-size: 12px; padding: 4px 10px;
                border: 1px solid #0b5cad; border-radius: 4px; color: #0b5cad;
                text-decoration: none; }
</style>
</head>
<body>
<h1>Research Radar 科研日报 · {{date}}</h1>
<div class="summary"><strong>今日趋势总述：</strong>{{summary}}</div>
{{sections}}
</body>
</html>
