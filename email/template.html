<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Daily Literature Intelligence Report · {{date}}</title>
<style>
  body { font-family: -apple-system, "Helvetica Neue", Arial, "PingFang SC", sans-serif;
         max-width: 760px; margin: 0 auto; padding: 20px 16px; color: #222; }
  h1 { font-size: 20px; border-bottom: 2px solid #333; padding-bottom: 10px;
       margin: 0 0 14px; }
  .greeting { font-size: 14px; color: #444; margin: 0 0 8px; line-height: 1.7; }
  /* Part 1：标题块上间距 ≥28px；主标题与副标题 ≥6px；副标题与正文 ≥14px */
  .part { margin-top: 28px; }
  .part-title { font-size: 17px; color: #0b5cad; margin: 0 0 8px;
                padding-bottom: 6px; border-bottom: 1px solid #e3eaf3; }
  .layer { color: #9aa5b1; font-size: 12px; margin: 0 0 16px; line-height: 1.6; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 10px; border-radius: 10px;
           color: #fff; margin-left: 6px; vertical-align: middle; font-weight: bold; }
  .badge-must { background: #c0392b; }
  .badge-important { background: #e67e22; }
  .badge-relate { background: #8a97a5; }
  .score { color: #0b5cad; font-weight: bold; margin-left: 8px; }
  .quick-item { border: 1px solid #e4e9ef; border-radius: 8px; padding: 10px 14px;
                margin: 10px 0; }
  .quick-rank { display: inline-block; min-width: 20px; font-weight: bold; color: #0b5cad; }
  .quick-body { margin-top: 6px; }
  .quick-title { font-size: 14px; font-weight: bold; line-height: 1.5; }
  .quick-cn { font-size: 13px; color: #444; margin: 6px 0 4px; line-height: 1.7; }
  .meta { color: #66788c; font-size: 12px; margin: 4px 0; line-height: 1.6; }
  /* 网页版入口按钮 */
  .page-link-block { text-align: center; margin: 30px 0 6px; }
  .page-link-btn { display: inline-block; background: #0b5cad; color: #fff;
                   font-size: 15px; font-weight: bold; padding: 12px 30px;
                   border-radius: 24px; text-decoration: none; }
  .page-link-note { text-align: center; color: #8a97a5; font-size: 12px;
                    margin: 8px 0 0; line-height: 1.6; }
</style>
</head>
<body>
<h1>Daily Literature Intelligence Report · {{date}}</h1>
<p class="greeting">{{user_name}}，你好。今日为你筛选出 {{count}} 篇论文：先用 30 秒浏览下方新闻摘要；论文详情卡片（中英文摘要）、一键反馈和今日趋势总结已移到网页版，网页中点击反馈即记录、不会跳转页面。</p>

<div class="page-link-block"><a class="page-link-btn" href="{{page_url}}">查看今日论文详情卡片与一键反馈 →</a></div>
<p class="page-link-note">网页版地址：{{page_url}}</p>

<div class="part">
<h2 class="part-title">Part 1 · 今日论文新闻摘要</h2>
<p class="layer">快速浏览层 · 今日推荐逐篇速览（等级徽标 + 总分 + 标题 + 精炼一句话）</p>
{{part1_list}}
</div>

<div class="page-link-block"><a class="page-link-btn" href="{{page_url}}">进入网页版查看详情，点击即完成反馈 →</a></div>

</body>
</html>
